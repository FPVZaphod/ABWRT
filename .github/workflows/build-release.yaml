name: Build and release

# Builds the macOS app bundles (Apple Silicon and Intel) and the portable Windows version.
# Run it manually from the Actions tab or by pushing to a feature branch. The zipped versions are
# available as artifacts of the workflow run.
#
# Pushing a version tag (for example `v0.4.1`) also creates a draft GitHub release with all versions
# and the release notes from CHANGELOG.md. The tag must match the version in ui/Cargo.toml and the
# changelog needs a section for it. Publish the draft on GitHub after checking it.

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build (${{ matrix.targets.name }})
    strategy:
      fail-fast: false
      matrix:
        targets:
          [
            {
              name: macos-arm,
              fancy_name: macos-apple-silicon,
              target: aarch64-apple-darwin,
              ffmpeg_filename: ffmpeg6arm.zip,
              ffprobe_filename: ffprobe6arm.zip,
            },
            {
              name: macos-intel,
              fancy_name: macos-intel,
              target: x86_64-apple-darwin,
              ffmpeg_filename: ffmpeg6intel.zip,
              ffprobe_filename: ffprobe6intel.zip,
            },
          ]
    # The Intel build is cross-compiled on the Apple Silicon runner
    runs-on: macos-latest
    env:
      APP_NAME: ABWRT
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that the tag matches the version of the program
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          CARGO_VERSION="$(grep -m1 '^version' ui/Cargo.toml | cut -d'"' -f2)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $CARGO_VERSION in ui/Cargo.toml"
            exit 1
          fi

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.targets.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-macos"

      - name: Cache cargo-bundle
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: cargo-bundle-${{ runner.os }}-${{ runner.arch }}-v1

      # Compiling cargo-bundle takes several minutes, so it is only installed when it is not cached
      - name: Install cargo-bundle
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --locked

      - name: Run tests
        if: ${{ matrix.targets.name == 'macos-arm' }}
        run: cargo test --workspace

      - name: Extract ffmpeg and ffprobe
        run: |
          cd ${{ github.workspace }}/ext/ffmpeg/${{ matrix.targets.name }}
          7z x ${{ matrix.targets.ffmpeg_filename }} -aoa
          7z x ${{ matrix.targets.ffprobe_filename }} -aoa
          chmod +x ffmpeg ffprobe

      - name: Create app bundle
        run: |
          # cargo-bundle needs to be run in the folder of the package, the workspace root has no package
          (cd ui && cargo bundle --release --target ${{ matrix.targets.target }} --features macos-app-bundle)
          BUNDLE_DIR="${{ github.workspace }}/target/${{ matrix.targets.target }}/release/bundle/osx"
          cp ext/ffmpeg/${{ matrix.targets.name }}/ffmpeg "$BUNDLE_DIR/$APP_NAME.app/Contents/MacOS/ffmpeg"
          cp ext/ffmpeg/${{ matrix.targets.name }}/ffprobe "$BUNDLE_DIR/$APP_NAME.app/Contents/MacOS/ffprobe"
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

      # Signing with a Developer ID certificate is optional. Without the secrets described in
      # _deploy/macos/SIGNING.md the app is only signed ad hoc and macOS will block it on first launch.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret set, the app will only be signed ad hoc"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' certificate found in the imported certificate"
            exit 1
          fi
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign app bundle
        run: |
          cd "$BUNDLE_DIR"
          if [ -n "$SIGNING_IDENTITY" ]; then
            # The hardened runtime and a secure timestamp are required for notarization.
            # Sign the contents first and the bundle last, --deep is not used on purpose.
            SIGN=(codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY")
          else
            SIGN=(codesign --force --sign -)
          fi
          "${SIGN[@]}" "$APP_NAME.app/Contents/MacOS/ffmpeg"
          "${SIGN[@]}" "$APP_NAME.app/Contents/MacOS/ffprobe"
          "${SIGN[@]}" "$APP_NAME.app/Contents/MacOS/abwrt"
          "${SIGN[@]}" "$APP_NAME.app"

          codesign --verify --deep --strict --verbose=2 "$APP_NAME.app"
          lipo -info "$APP_NAME.app/Contents/MacOS/abwrt"

      # Notarization lets Gatekeeper open the app without any warning. It needs an Apple ID with an
      # app-specific password and the team ID, see _deploy/macos/SIGNING.md.
      - name: Notarize app bundle
        if: ${{ env.SIGNING_IDENTITY != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are not all set, the app is signed but not notarized"
            exit 0
          fi

          cd "$BUNDLE_DIR"
          ditto -c -k --keepParent "$APP_NAME.app" "$RUNNER_TEMP/notarize.zip"

          RESULT="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json || true)"
          echo "$RESULT"
          STATUS="$(echo "$RESULT" | jq -r '.status // empty')"
          SUBMISSION_ID="$(echo "$RESULT" | jq -r '.id // empty')"

          if [ "$STATUS" != "Accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            fi
            echo "::error::Notarization was not accepted (status: ${STATUS:-unknown})"
            exit 1
          fi

          # Attach the notarization ticket so the app also opens without an internet connection
          xcrun stapler staple "$APP_NAME.app"
          xcrun stapler validate "$APP_NAME.app"
          spctl --assess --type execute --verbose=2 "$APP_NAME.app"

      - name: Package app bundle
        run: |
          mkdir -p "${{ github.workspace }}/_deploy/macos"
          cd "$BUNDLE_DIR"
          # ditto keeps the file permissions, code signatures and the notarization ticket of the bundle intact
          ditto -c -k --keepParent "$APP_NAME.app" "${{ github.workspace }}/_deploy/macos/abwrt-${{ matrix.targets.fancy_name }}.zip"

      - name: Remove signing keychain
        if: ${{ always() && env.KEYCHAIN_PATH != '' }}
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Save app bundle
        uses: actions/upload-artifact@v4
        with:
          name: abwrt-${{ matrix.targets.name }}
          path: ${{ github.workspace }}/_deploy/macos/*.zip
          if-no-files-found: error

  # Portable Windows version: a folder with the program, ffmpeg and ffprobe that can be started from anywhere.
  # The file portable.txt next to the program makes it store its settings and logs in the folder `data`.
  build-windows:
    name: Build (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that the tag matches the version of the program
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          CARGO_VERSION="$(grep -m1 '^version' ui/Cargo.toml | cut -d'"' -f2)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $CARGO_VERSION in ui/Cargo.toml"
            exit 1
          fi

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-windows"

      - name: Extract ffmpeg
        run: |
          cd ext/ffmpeg/windows64
          7z x ffmpeg-6.0-essentials_build.7z -aoa
          echo "$GITHUB_WORKSPACE/ext/ffmpeg/windows64/ffmpeg-6.0-essentials_build/bin" >> "$GITHUB_PATH"

      # ffmpeg is in the path now, so the tests that render with ffmpeg run as well
      - name: Run tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --package abwrt

      - name: Create portable version
        run: |
          FFMPEG_DIR="ext/ffmpeg/windows64/ffmpeg-6.0-essentials_build"
          mkdir -p ABWRT-windows
          cp target/release/abwrt.exe ABWRT-windows/
          cp "$FFMPEG_DIR/bin/ffmpeg.exe" "$FFMPEG_DIR/bin/ffprobe.exe" ABWRT-windows/
          cp LICENSE.md ABWRT-windows/LICENSE.md
          cp "$FFMPEG_DIR/LICENSE" ABWRT-windows/ffmpeg-LICENSE.txt
          cp "$FFMPEG_DIR/README.txt" ABWRT-windows/ffmpeg-README.txt
          cat > ABWRT-windows/portable.txt <<'EOF'
          This file switches on the portable mode of ABWRT: the settings and the log are stored in the
          folder "data" next to abwrt.exe instead of in the folders of your user account.
          Delete this file to store them in %APPDATA%\abwrt like an installed program.
          EOF
          mkdir -p _deploy/windows-portable
          7z a "_deploy/windows-portable/abwrt-windows-portable.zip" ABWRT-windows

      - name: Save portable version
        uses: actions/upload-artifact@v4
        with:
          name: abwrt-windows
          path: _deploy/windows-portable/*.zip
          if-no-files-found: error

  # Creates a draft release when a version tag was pushed, publish it on GitHub after checking it
  release:
    name: Create draft release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install parse-changelog
        uses: taiki-e/install-action@v2
        with:
          tool: parse-changelog

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          parse-changelog CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/release_notes.md"
          cat >> "$RUNNER_TEMP/release_notes.md" <<'EOF'

          ## Installation

          ### Windows

          Download `abwrt-windows-portable.zip`, unzip it and start `abwrt.exe` in the folder. Nothing needs to be installed. The settings and the log are stored in the folder `data` next to the program. Windows may show "Windows protected your PC" because the program is not signed, click "More info" and "Run anyway".

          ### macOS

          Download `abwrt-macos-apple-silicon.zip` for Apple Silicon Macs or `abwrt-macos-intel.zip` for Intel Macs, unzip it and drag `ABWRT.app` to your Applications folder.

          The app is not signed with a Developer ID certificate. If macOS says that the app is damaged or from an unverified developer, remove the quarantine flag once in the terminal:

          ```
          xattr -dr com.apple.quarantine "/Applications/ABWRT.app"
          ```
          EOF

      - name: Download app bundles
        uses: actions/download-artifact@v4
        with:
          pattern: abwrt-*
          merge-multiple: true
          path: ${{ github.workspace }}/_deploy/artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ABWRT ${{ github.ref_name }}
          files: ${{ github.workspace }}/_deploy/artifacts/*.zip
          body_path: ${{ runner.temp }}/release_notes.md
          draft: true
