name: Release

permissions:
  contents: write

# Template of the original project. The releases of ABWRT are created by build-release.yaml when a version
# tag is pushed, so this workflow is only started manually. Otherwise both workflows would create a release
# for the same tag.
on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install parse-changelog
        uses: taiki-e/install-action@v2
        with:
          tool: parse-changelog

      - name: Generate release notes
        run: parse-changelog ${{ github.workspace }}/CHANGELOG.md > ${{ github.workspace }}-release_notes.md

      - name: Download artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: abwrt-*
          merge-multiple: true
          path: ${{ github.workspace }}/_deploy/artifacts

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.download.outputs.download-path }}/*
          draft: true
          body_path: ${{ github.workspace }}-release_notes.md
